name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — lint e inicialização
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coursesphere
          POSTGRES_PASSWORD: coursesphere123
          POSTGRES_DB: coursesphere_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://coursesphere:coursesphere123@localhost:5432/coursesphere_db
      JWT_SECRET: ci_secret_test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Rodar migrations
        working-directory: backend
        run: npm run migrate

      - name: Verificar se o servidor inicia
        working-directory: backend
        run: |
          node src/app.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm install

      - name: Build de produção
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api
